<div class="parent">
  <div class="login-card position-relative">

    <div class="position-absolute top-0 end-0 mt-3 me-3">
      <button class="btn btn-sm btn-outline-primary me-2">EN</button>
      <button class="btn btn-sm btn-outline-secondary">HU</button>
    </div>

    <h3 class="mt-4 text-center">Bejelentkezés a portálra</h3>

    <form (ngSubmit)="onLogin()">

      <div class="form-floating mb-3">
        <input
          type="email"
          [(ngModel)]="loginObj.email"
          name="email"
          class="form-control"
          placeholder="Email megadása"
          required
        />
        <label class="form-label fw-semibold">Email cím</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="password"
          [(ngModel)]="loginObj.password"
          name="password"
          class="form-control"
          placeholder="Jelszó megadása"
          required
        />
        <label class="form-label fw-semibold">Jelszó</label>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger text-center">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-login w-100 py-2 fw-semibold"
        [disabled]="loading"
      >
        {{ loading ? 'Belépés...' : 'Belépés' }}
      </button>

    </form>

    <button
      class="btn btn-reg w-100 py-2 fw-semibold mt-2"
      routerLink="/registration"
    >
      Regisztráció
    </button>

    <div class="d-flex justify-content-center mt-3">
      <a routerLink="/forgotpwd" class="forgotpwd">
        Elfelejtetted a jelszavad?
      </a>
    </div>

  </div>
</div>
